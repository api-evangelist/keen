apis:
- aid: keen:cached-queries-api
  name: Keen Cached Queries API
  description: >-
    The Keen Cached Queries API allows developers to create, manage, and retrieve pre-defined queries
    that are automatically refreshed on a schedule. Cached queries improve performance for frequently
    accessed analytics by storing pre-computed results, making them ideal for powering dashboards and
    embedded analytics experiences.
  humanURL: https://keen.io/docs/api/#cached-queries
  tags:
  - Analytics
  - Caching
  - Performance
  - Queries
  properties:
  - type: Documentation
    url: https://keen.io/docs/api/#cached-queries
  - type: OpenAPI
    url: openapi/keen-cached-queries-api-openapi.yml
- aid: keen:saved-queries-api
  name: Keen Saved Queries API
  description: >-
    The Keen Saved Queries API enables developers to create and manage reusable query definitions. Saved
    queries store query parameters as named resources that can be retrieved and executed later, enabling
    consistent analytics across applications and simplifying the management of complex query configurations.
  humanURL: https://keen.io/docs/api/#saved-queries
  tags:
  - Analytics
  - Queries
  - Saved Queries
