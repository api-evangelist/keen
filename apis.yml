aid: keen
name: Keen
description: >-
  Keen is an event analytics platform and API that enables developers to collect, store, analyze, and visualize custom
  event data. It provides a flexible RESTful API for streaming events, running multi-dimensional queries, and building
  embedded analytics dashboards for products and internal tools.
